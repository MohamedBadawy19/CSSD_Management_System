<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch Detail - CSSD</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/extended_styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="dashboard-wrapper theme-blue">
    <nav class="dashboard-nav theme-dark-blue">
      <div class="nav-brand">
        <a href="cssd-batch-list.html" class="btn-back-icon"><i data-lucide="arrow-left"></i></a>
        <div class="nav-title">
          <h2 id="navTitle">Batch #—</h2>
          <p id="navStatus">—</p>
        </div>
      </div>
    </nav>

    <main class="dashboard-main details-main">
      <div class="container-center">

        <div class="detail-card summary-card">
          <h3>Batch Details</h3>
          <div class="summary-grid" style="margin-top:1rem;" id="batchDetails"><!-- JS --></div>
          <div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:.75rem 1rem;font-size:.8rem;color:#92400e;display:flex;gap:.5rem;margin-top:1rem;">
            <i data-lucide="lock" style="width:16px;height:16px;flex-shrink:0;"></i>
            <span>Batch records are <strong>read-only</strong>. Temperature and duration cannot be edited after submission.</span>
          </div>
        </div>

        <div class="detail-card list-card">
          <div class="card-header pb-border"><h4>Linked Requests</h4></div>
          <div class="cssd-list" id="linkedRequests"><!-- JS --></div>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const id    = parseInt(new URLSearchParams(location.search).get('id') || MOCK.batches[0].id);
      const batch = MOCK.batches.find(b => b.id === id) || MOCK.batches[0];

      document.getElementById('navTitle').textContent  = `Batch #${batch.id}`;
      document.getElementById('navStatus').textContent = batch.status;

      document.getElementById('batchDetails').innerHTML = `
        <div class="sg-item"><i data-lucide="user"></i><div><span class="sg-label">Operator</span><span class="sg-value">${batch.operator}</span></div></div>
        <div class="sg-item"><i data-lucide="flask-conical"></i><div><span class="sg-label">Method</span><span class="sg-value">${batch.method}</span></div></div>
        <div class="sg-item"><i data-lucide="thermometer"></i><div><span class="sg-label">Temperature</span><span class="sg-value">${batch.temperature}°C</span></div></div>
        <div class="sg-item"><i data-lucide="timer"></i><div><span class="sg-label">Cycle Duration</span><span class="sg-value">${batch.duration} minutes</span></div></div>
        <div class="sg-item"><i data-lucide="activity"></i><div><span class="sg-label">Status</span><span class="sg-value">${batch.status}</span></div></div>
        <div class="sg-item"><i data-lucide="calendar"></i><div><span class="sg-label">Created</span><span class="sg-value">${batch.created_at}</span></div></div>
        ${batch.notes ? `<div class="sg-item"><i data-lucide="file-text"></i><div><span class="sg-label">Notes</span><span class="sg-value">${batch.notes}</span></div></div>` : ''}
      `;

      // Linked requests = requests that are Sterilized+ (mock link)
      const linked = MOCK.requests.filter(r => ['Sterilized','Packed','Delivered'].includes(r.status)).slice(0, 3);
      const linksEl = document.getElementById('linkedRequests');
      linksEl.innerHTML = linked.length
        ? linked.map(r => `
          <a href="cssd-request-details.html?id=${r.id}" class="cssd-list-item" style="text-decoration:none;color:inherit;display:flex;">
            <div class="item-main">
              <div class="item-title"><span class="item-id">REQ-${String(r.id).padStart(4,'0')}</span></div>
              <div class="item-subtitle">${r.requester}</div>
            </div>
            <div class="item-actions">
              <span class="pill" style="background:#6366f120;color:#6366f1;border:1px solid #6366f140;border-radius:999px;padding:2px 10px;font-size:.78rem;">${r.status}</span>
            </div>
          </a>`).join('')
        : '<p style="padding:1rem;color:#94a3b8;font-size:.875rem;">No requests linked to this batch yet.</p>';

      lucide.createIcons();
    });
  </script>
</body>
</html>
