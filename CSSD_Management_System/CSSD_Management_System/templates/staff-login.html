{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login - CSSD</title>
  <link rel="stylesheet" href="{% static 'styles.css' %}">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="page-wrapper theme-blue">
    <header class="header theme-blue">
      <div class="header-content">
        <div class="header-title">
          <h1>CSSD Management System</h1>
          <p>Central Sterile Supply Department</p>
        </div>
        <div class="system-status">
          <div class="status-dot"></div>
          <span>System Online</span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="login-container-wrapper">

        <a href="{% url 'home' %}" class="back-link">
          <i data-lucide="arrow-left" style="width:16px;height:16px;"></i>
          Back to role selection
        </a>

        <div class="login-card">
          <div class="login-header">
            <div class="app-icon blue">
              <i data-lucide="activity" style="width:32px;height:32px;"></i>
            </div>
            <h2 class="login-title">Staff Login</h2>
            <p class="login-subtitle">Enter your credentials to access CSSD</p>
          </div>

          <!-- PROJ-11: CSSD Staff Login -->
          <form id="loginForm" data-role="Staff" action="{% url 'login' %}" method = 'post'>
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <div class="input-wrapper">
                <i data-lucide="mail" class="input-icon"></i>
                <input type="email" name="username" class="form-input" placeholder="staff@hospital.com" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Password</label>
              <div class="input-wrapper">
                <i data-lucide="lock" class="input-icon"></i>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
                <button type="button" class="btn-toggle-password" id="togglePasswordBtn">
                  <i data-lucide="eye" id="eyeIcon"></i>
                </button>
              </div>
            </div>

            <div class="form-actions">
              <label class="checkbox-label">
                <input type="checkbox" class="checkbox-input"> Remember me
              </label>
              <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-submit blue" id="submitBtn">
              <span id="btnText">Sign In to CSSD</span>
              <i data-lucide="log-in" id="btnIcon" style="width:18px;height:18px;margin-left:8px;"></i>
            </button>
          </form>

          <div class="security-notice notice-warning login-security-notice">
            <i data-lucide="shield-alert" class="security-icon"></i>
            <div class="security-content">
              <h4>Security Notice</h4>
              <p>Unauthorized access to CSSD systems is strictly prohibited and monitored.</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../static/mock-data.js"></script>
  <script src="../static/script.js"></script>
</body>
</html>
