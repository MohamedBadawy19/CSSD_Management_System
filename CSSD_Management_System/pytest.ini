[pytest]
# ─── Django Settings ───────────────────────────────────────────────────────────
# Tells pytest-django which settings module to use when booting Django.
# Without this, every test run would fail with "ImproperlyConfigured".
DJANGO_SETTINGS_MODULE = CSSD_Management_System.settings

# ─── Test Discovery ───────────────────────────────────────────────────────────
# Where to look for tests (the backend root and all sub-packages).
testpaths =
    tests
    CSSD_Management_System
    authentication

# File patterns pytest scans for tests.
python_files = tests.py test_*.py *_tests.py

# Class patterns pytest treats as test classes.
python_classes = Test*

# Function patterns pytest treats as test functions.
python_functions = test_*

# ─── Markers ──────────────────────────────────────────────────────────────────
# Pre-declare custom markers so `pytest --strict-markers` won't complain.
markers =
    slow: marks tests that take a long time (deselect with '-m "not slow"')
    integration: marks integration tests that hit external services
    unit: marks pure unit tests (no database, no I/O)

# ─── Coverage (pytest-cov) ───────────────────────────────────────────────────
# These options are passed to pytest-cov automatically.
addopts =
    --strict-markers
    -v
    --tb=short
    --cov=CSSD_Management_System
    --cov=authentication
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=70
