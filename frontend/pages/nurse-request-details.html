<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Details - Nurse Portal</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/extended_styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="dashboard-wrapper theme-teal">
    <nav class="dashboard-nav theme-dark-teal">
      <div class="nav-brand">
        <div class="nav-logo teal"><i data-lucide="stethoscope"></i></div>
        <div class="nav-title">
          <h2>Request Details</h2>
          <p id="navReqId">REQ-0000</p>
        </div>
      </div>
      <div class="nav-actions">
        <a href="nurse-dashboard.html" class="btn-back"><i data-lucide="arrow-left"></i> Back to Dashboard</a>
      </div>
    </nav>

    <main class="dashboard-main details-main">
      <div class="container-center">

        <!-- Summary -->
        <div class="detail-card summary-card">
          <div class="summary-header">
            <h3 id="detailReqId">REQ-0000</h3>
            <span id="urgentLabel" style="display:none;" class="text-urgent"><i data-lucide="alert-triangle"></i> Urgent Priority</span>
          </div>
          <div class="summary-pills">
            <span id="detailStatus" class="pill">—</span>
            <span id="detailPriority" class="pill pill-normal">Normal</span>
          </div>
          <div class="summary-grid">
            <div class="sg-item"><i data-lucide="building"></i>
              <div><span class="sg-label">Department</span><span class="sg-value" id="detailDept">—</span></div>
            </div>
            <div class="sg-item"><i data-lucide="user"></i>
              <div><span class="sg-label">Requested By</span><span class="sg-value" id="detailRequester">—</span></div>
            </div>
            <div class="sg-item"><i data-lucide="calendar"></i>
              <div><span class="sg-label">Submitted</span><span class="sg-value" id="detailDate">—</span></div>
            </div>
            <div class="sg-item"><i data-lucide="timer"></i>
              <div><span class="sg-label">Estimated Delivery</span><span class="sg-value" id="detailEta" style="color:#0d9488;font-weight:600;">—</span></div>
            </div>
          </div>
        </div>

        <!-- Vertical timeline -->
        <div class="detail-card timeline-card">
          <div class="card-header"><i data-lucide="clock"></i> <h4>Processing Timeline</h4></div>
          <div class="vertical-timeline" id="vtTimeline"><!-- JS --></div>
        </div>

        <!-- Instruments -->
        <div class="detail-card instruments-card">
          <h3>Requested Instruments</h3>
          <ul class="instrument-checklist" id="instrList"><!-- JS --></ul>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const VT_STEPS = [
      { key:'submitted',  label:'Submitted' },
      { key:'collected',  label:'Collected' },
      { key:'cleaned',    label:'Cleaned' },
      { key:'sterilized', label:'Sterilized' },
      { key:'packed',     label:'Packed' },
      { key:'delivered',  label:'Ready for Delivery' },
    ];
    const STATUS_ORDER = ['Requested','Collected','Cleaned','Sterilized','Packed','Delivered'];
    const statusColors = {
      Requested:'#f97316', Collected:'#3b82f6', Cleaned:'#06b6d4',
      Sterilized:'#6366f1', Packed:'#a855f7', Delivered:'#10b981'
    };

    function etaMins(req) {
      return Math.max(0, (STATUS_ORDER.length - 1 - STATUS_ORDER.indexOf(req.status)) * 20);
    }
    function fmtEta(m) { return m===0 ? 'Delivered' : m<60 ? `~${m} min` : `~${(m/60).toFixed(1)} hr`; }

    function renderVTimeline(req) {
      const idx = STATUS_ORDER.indexOf(req.status);
      return VT_STEPS.map((step, i) => {
        const done = i < idx || req.status === 'Delivered';
        const isLast = i === VT_STEPS.length - 1;
        return `
        <div class="vt-item ${done ? 'completed' : ''} ${isLast ? 'pending-last' : ''}">
          ${!isLast ? '<div class="vt-line"></div>' : ''}
          <div class="vt-icon ${isLast && !done ? 'pending-node' : ''}">
            ${done ? '<i data-lucide="check"></i>' : ''}
          </div>
          <div class="vt-content">
            <h5>${step.label}</h5>
            ${done && i > 0 ? `<span>${req.submitted_at}</span>` : ''}
          </div>
        </div>`;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const id  = parseInt(new URLSearchParams(location.search).get('id') || '1');
      const req = MOCK.requests.find(r => r.id === id) || MOCK.requests[0];
      const fmtId = `REQ-${String(req.id).padStart(4,'0')}`;
      const eta   = etaMins(req);
      const color = statusColors[req.status] || '#64748b';

      document.getElementById('navReqId').textContent   = fmtId;
      document.getElementById('detailReqId').textContent = fmtId;
      document.getElementById('detailDept').textContent      = req.department;
      document.getElementById('detailRequester').textContent = req.requester;
      document.getElementById('detailDate').textContent      = req.submitted_at;
      document.getElementById('detailEta').textContent       = fmtEta(eta);

      if (req.priority === 'Urgent') {
        document.getElementById('urgentLabel').style.display = '';
        document.getElementById('detailPriority').className = 'pill pill-urgent';
        document.getElementById('detailPriority').textContent = 'Urgent';
      }

      const stEl = document.getElementById('detailStatus');
      stEl.textContent = req.status;
      Object.assign(stEl.style, { background:`${color}20`, color, border:`1px solid ${color}40`,
        borderRadius:'999px', padding:'2px 10px', fontSize:'.8rem', fontWeight:'600' });

      document.getElementById('vtTimeline').innerHTML  = renderVTimeline(req);
      document.getElementById('instrList').innerHTML   = req.items.map(i =>
        `<li><span>${i}</span><i data-lucide="check-circle-2" class="icon-green"></i></li>`
      ).join('');

      lucide.createIcons();
    });
  </script>
</body>
</html>
